<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>La Leyenda de Keke · Arena de Juegos y Crónicas de Las Erillas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-void: #040100;
      --card-bg: rgba(13, 5, 2, 0.88);
      --gold-pure: #fff5d6;
      --gold-bright: #ffd166;
      --gold-mid: #f59e0b;
      --fire-orange: #ea580c;
      --fire-crimson: #991b1b;
      --unicaja-emerald: #10b981;
      --unicaja-glow: #34d399;
      --trotasierra-blue: #38bdf8;
      --text-parchment: #f8ede3;
      --text-muted: #cbb8a6;
      --border-gold: rgba(245, 158, 11, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      width: 100%;
      max-width: 100%;
      overflow-x: clip;
    }

    body {
      background-color: var(--bg-void);
      background-image:
        radial-gradient(ellipse 85% 45% at 50% 0%, rgba(234, 88, 12, 0.28) 0%, transparent 60%),
        radial-gradient(ellipse 70% 50% at 15% 45%, rgba(153, 27, 27, 0.22) 0%, transparent 60%),
        radial-gradient(ellipse 70% 50% at 85% 65%, rgba(16, 185, 129, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse 90% 45% at 50% 100%, rgba(234, 88, 12, 0.32) 0%, transparent 65%),
        linear-gradient(180deg, #050100 0%, #110401 50%, #050100 100%);
      color: var(--text-parchment);
      font-family: 'Cormorant Garamond', Georgia, serif;
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      overflow-x: clip;
      overflow-y: auto;
      line-height: 1.88;
      position: relative;
    }

    .vignette-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, transparent 42%, rgba(0, 0, 0, 0.82) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: linear-gradient(90deg, var(--fire-orange), var(--gold-bright), var(--unicaja-emerald));
      box-shadow: 0 0 18px var(--gold-bright);
      z-index: 120;
      transition: width 0.12s ease-out;
    }

    /* =========================================================================
       BARRA SUPERIOR HUD (MENÚ PRINCIPAL)
       ========================================================================= */
    .top-hud {
      position: sticky;
      top: 0;
      z-index: 60;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.55rem;
      padding: 0.7rem 1.15rem;
      background: rgba(8, 2, 1, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-gold);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.85), 0 1px 18px rgba(234, 88, 12, 0.25);
    }

    .hud-brand {
      font-family: 'Cinzel', serif;
      font-weight: 900;
      font-size: 0.88rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold-bright);
      text-shadow: 0 0 16px rgba(245, 158, 11, 0.75);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      cursor: pointer;
    }

    .hud-nav-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
    }

    .btn-arcane {
      font-family: 'Cinzel', serif;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold-pure);
      background: linear-gradient(135deg, rgba(234, 88, 12, 0.32), rgba(120, 53, 15, 0.45));
      border: 1px solid var(--border-gold);
      padding: 0.45rem 0.85rem;
      border-radius: 7px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 0 12px rgba(234, 88, 12, 0.2);
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .btn-arcane:hover {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.52), rgba(234, 88, 12, 0.6));
      border-color: var(--gold-bright);
      box-shadow: 0 0 24px rgba(255, 209, 102, 0.65);
    }

    .btn-arcane:active {
      transform: scale(0.96);
    }

    .btn-arcane.emerald-nav {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.3), rgba(6, 78, 59, 0.48));
      border-color: rgba(52, 211, 153, 0.55);
    }

    .btn-arcane.emerald-nav:hover {
      border-color: var(--unicaja-glow);
      box-shadow: 0 0 24px rgba(52, 211, 153, 0.65);
    }

    .btn-arcane.blue-nav {
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.32), rgba(30, 58, 138, 0.52));
      border-color: rgba(56, 189, 248, 0.55);
    }

    .btn-arcane.blue-nav:hover {
      border-color: var(--trotasierra-blue);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.65);
    }

    .hud-passport-pill {
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      border: 1px solid rgba(245, 158, 11, 0.5);
      background: rgba(20, 8, 3, 0.9);
      color: var(--gold-bright);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .hud-passport-pill.registered {
      border-color: rgba(52, 211, 153, 0.6);
      color: var(--unicaja-glow);
    }

    /* Contenedor Principal */
    .chronicle-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 1.5rem 1rem 5rem;
    }

    .ornate-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin: 0.75rem auto 1.25rem;
      max-width: 460px;
      width: 100%;
      color: var(--gold-bright);
      text-shadow: 0 0 14px rgba(245, 158, 11, 0.8);
    }

    .ornate-divider .line {
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
      box-shadow: 0 0 10px var(--gold-mid);
    }

    .section-heading {
      text-align: center;
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.42rem, 3.8vw, 2.25rem);
      color: var(--gold-bright);
      letter-spacing: 0.08em;
      margin-bottom: 0.3rem;
      text-shadow: 0 0 24px rgba(234, 88, 12, 0.75);
    }

    .section-subkicker {
      text-align: center;
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    /* =========================================================================
       BLOQUE 1: PORTADA DE JUEGOS COMPACTOS + PASAPORTE
       ========================================================================= */
    .games-hub-section {
      width: 100%;
      margin-bottom: 2.2rem;
    }

    .athlete-passport-card {
      width: 100%;
      max-width: 740px;
      margin: 0 auto 1.5rem;
      padding: 1rem 1.25rem;
      background: linear-gradient(145deg, rgba(28, 12, 4, 0.95), rgba(10, 4, 2, 0.98));
      border: 1.5px solid var(--gold-bright);
      border-radius: 14px;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.88), 0 0 28px rgba(245, 158, 11, 0.22);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    @keyframes passportShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-7px); }
      40%, 80% { transform: translateX(7px); }
    }

    .athlete-passport-card.passport-alert {
      border-color: #ef4444 !important;
      box-shadow: 0 0 42px rgba(239, 68, 68, 0.8), inset 0 0 22px rgba(239, 68, 68, 0.3) !important;
      animation: passportShake 0.45s ease-in-out;
    }

    .passport-top-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.55rem;
    }

    .passport-label {
      font-family: 'Cinzel', serif;
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold-bright);
    }

    .passport-badge {
      font-family: 'Cinzel', serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 0.22rem 0.68rem;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .passport-badge.missing {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.22);
      border: 1px solid rgba(239, 68, 68, 0.55);
    }

    .passport-badge.registered {
      color: #6ee7b7;
      background: rgba(16, 185, 129, 0.22);
      border: 1px solid rgba(52, 211, 153, 0.55);
    }

    .passport-form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
    }

    .passport-input {
      flex: 1;
      min-width: 190px;
      padding: 0.65rem 0.9rem;
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: #ffffff;
      background: rgba(5, 2, 1, 0.92);
      border: 1.5px solid rgba(245, 158, 11, 0.55);
      border-radius: 9px;
      outline: none;
    }

    .passport-input:focus {
      border-color: var(--gold-bright);
      box-shadow: 0 0 16px rgba(255, 209, 102, 0.45);
    }

    .passport-save-btn {
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #ffffff;
      background: linear-gradient(135deg, #d97706, #ea580c);
      border: 1.5px solid var(--gold-bright);
      padding: 0.65rem 1.2rem;
      border-radius: 9px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(234, 88, 12, 0.45);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .passport-save-btn:hover {
      box-shadow: 0 0 26px rgba(255, 209, 102, 0.75);
    }

    .passport-error-msg {
      margin-top: 0.5rem;
      font-family: 'Cinzel', serif;
      font-size: 0.76rem;
      font-weight: 700;
      color: #f87171;
      display: none;
    }

    .passport-error-msg.visible {
      display: block;
    }

    /* Grid de 3 Tarjetas Compactas de Juegos */
    .compact-games-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.15rem;
    }

    @media (max-width: 900px) {
      .compact-games-grid {
        grid-template-columns: 1fr;
      }
    }

    .compact-game-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(160deg, rgba(24, 10, 4, 0.94), rgba(9, 3, 1, 0.98));
      border: 1.5px solid var(--border-gold);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.88), inset 0 0 24px rgba(245, 158, 11, 0.06);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      overflow: hidden;
    }

    .compact-game-card:hover {
      transform: translateY(-4px);
      border-color: var(--gold-bright);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.94), 0 0 32px rgba(245, 158, 11, 0.35);
    }

    .compact-game-card.theme-emerald {
      border-color: rgba(16, 185, 129, 0.5);
    }

    .compact-game-card.theme-emerald:hover {
      border-color: var(--unicaja-glow);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.94), 0 0 32px rgba(16, 185, 129, 0.38);
    }

    .compact-game-card.theme-blue {
      border-color: rgba(56, 189, 248, 0.5);
    }

    .compact-game-card.theme-blue:hover {
      border-color: var(--trotasierra-blue);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.94), 0 0 32px rgba(56, 189, 248, 0.38);
    }

    .compact-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .compact-game-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.65rem;
      background: rgba(245, 158, 11, 0.16);
      border: 1px solid rgba(255, 209, 102, 0.45);
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.25);
    }

    .theme-emerald .compact-game-icon {
      background: rgba(16, 185, 129, 0.16);
      border-color: rgba(52, 211, 153, 0.45);
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.25);
    }

    .theme-blue .compact-game-icon {
      background: rgba(2, 132, 199, 0.2);
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.25);
    }

    .compact-game-pill {
      font-family: 'Cinzel', serif;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      color: var(--gold-bright);
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    .theme-emerald .compact-game-pill {
      color: var(--unicaja-glow);
      background: rgba(16, 185, 129, 0.14);
      border-color: rgba(52, 211, 153, 0.35);
    }

    .theme-blue .compact-game-pill {
      color: #7dd3fc;
      background: rgba(2, 132, 199, 0.18);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .compact-game-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
      margin-bottom: 0.45rem;
    }

    .compact-game-desc {
      font-size: 1.02rem;
      color: var(--text-muted);
      line-height: 1.48;
      margin-bottom: 1.1rem;
    }

    .btn-play-compact {
      width: 100%;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ffffff;
      background: linear-gradient(90deg, #b45309, #ea580c);
      border: 1.5px solid var(--gold-bright);
      padding: 0.72rem 1rem;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      box-shadow: 0 6px 22px rgba(234, 88, 12, 0.4);
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn-play-compact:hover {
      filter: brightness(1.12);
      box-shadow: 0 0 28px rgba(255, 209, 102, 0.7);
    }

    .btn-play-compact:active {
      transform: scale(0.97);
    }

    .theme-emerald .btn-play-compact {
      background: linear-gradient(90deg, #047857, #10b981);
      border-color: var(--unicaja-glow);
      box-shadow: 0 6px 22px rgba(16, 185, 129, 0.35);
    }

    .theme-blue .btn-play-compact {
      background: linear-gradient(90deg, #1d4ed8, #0284c7);
      border-color: var(--trotasierra-blue);
      box-shadow: 0 6px 22px rgba(2, 132, 199, 0.4);
    }

    /* =========================================================================
       BLOQUE 2: RANKING DESPLEGABLE CON PESTAÑAS (DEBAJO DEL MENÚ DE JUEGOS)
       ========================================================================= */
    .ranking-drawer-section {
      width: 100%;
      margin: 0 auto 3rem;
      background: linear-gradient(160deg, rgba(20, 9, 4, 0.95), rgba(8, 3, 1, 0.98));
      border: 1.5px solid var(--border-gold);
      border-radius: 16px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.9), 0 0 30px rgba(234, 88, 12, 0.18);
      overflow: hidden;
    }

    .ranking-drawer-toggle {
      width: 100%;
      background: linear-gradient(90deg, rgba(234, 88, 12, 0.18), rgba(16, 8, 3, 0.9), rgba(16, 185, 129, 0.15));
      border: none;
      padding: 1.05rem 1.35rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      cursor: pointer;
      color: var(--gold-bright);
      text-align: left;
    }

    .ranking-drawer-toggle:hover {
      background: linear-gradient(90deg, rgba(234, 88, 12, 0.28), rgba(24, 12, 5, 0.95), rgba(16, 185, 129, 0.22));
    }

    .ranking-drawer-title-group {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .ranking-drawer-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.05rem, 2.6vw, 1.38rem);
      font-weight: 700;
      color: var(--gold-bright);
      text-shadow: 0 0 14px rgba(245, 158, 11, 0.55);
    }

    .ranking-drawer-meta {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .leaderboard-badge {
      font-family: 'Cinzel', serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--unicaja-glow);
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(52, 211, 153, 0.4);
      padding: 0.26rem 0.68rem;
      border-radius: 6px;
      transition: all 0.25s ease;
    }

    .leaderboard-badge.live-flash {
      color: #ffffff;
      background: rgba(245, 158, 11, 0.38);
      border-color: var(--gold-bright);
      box-shadow: 0 0 14px rgba(255, 209, 102, 0.65);
    }

    .drawer-chevron {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gold-pure);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 0.3rem 0.75rem;
      border-radius: 8px;
      transition: transform 0.25s ease;
    }

    .ranking-drawer-body {
      padding: 0 1.25rem 1.35rem;
      border-top: 1px solid rgba(245, 158, 11, 0.22);
    }

    .ranking-drawer-body.collapsed {
      display: none;
    }

    /* Pestañas del Ranking */
    .ranking-tabs-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.55rem;
      margin: 1rem 0 1.1rem;
    }

    @media (max-width: 640px) {
      .ranking-tabs-bar {
        grid-template-columns: 1fr;
      }
    }

    .ranking-tab-btn {
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: rgba(10, 4, 2, 0.9);
      border: 1px solid rgba(245, 158, 11, 0.28);
      padding: 0.65rem 0.8rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .ranking-tab-btn:hover {
      border-color: var(--gold-bright);
      color: var(--gold-pure);
    }

    .ranking-tab-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, rgba(234, 88, 12, 0.42), rgba(180, 83, 9, 0.55));
      border-color: var(--gold-bright);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.35);
    }

    .ranking-tab-panel {
      display: none;
    }

    .ranking-tab-panel.active {
      display: block;
    }

    .leaderboard-table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
    }

    .leaderboard-table th {
      text-align: left;
      padding: 0.55rem 0.65rem;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid rgba(245, 158, 11, 0.28);
      white-space: nowrap;
    }

    .leaderboard-table td {
      padding: 0.62rem 0.65rem;
      color: var(--text-parchment);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .leaderboard-table tr:last-child td {
      border-bottom: none;
    }

    .leaderboard-table tr.is-current-player td {
      background: rgba(245, 158, 11, 0.16);
      color: var(--gold-bright);
      font-weight: 700;
    }

    .leaderboard-placeholder-row td {
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: var(--text-muted);
      padding: 1.1rem;
    }

    .leaderboard-expand-wrap {
      display: flex;
      justify-content: center;
      margin-top: 0.9rem;
    }

    .btn-expand-leaderboard {
      font-family: 'Cinzel', serif;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--gold-bright);
      background: linear-gradient(135deg, rgba(234, 88, 12, 0.22), rgba(16, 8, 3, 0.95));

      align-items: center;

    .btn-expand-leaderboard:hover {

      border-color: var(--gold-bright);

      box-shadow: 0 0 22px rgba(255, 209, 102, 0.55);
    }

    .btn-expand-leaderboard:active {
      transform: scale(0.97);
    }

    /* =========================================================================
       PESTAÑA / VISTA DEDICADA DE ARENA DE JUEGO EN GRANDE
       ========================================================================= */
    .arena-stage-view {
      display: none;
      width: 100%;
      animation: fadeIn 0.22s ease;
    }

    .arena-stage-view.active {
      display: block;
    }

    .home-portal-view.hidden-view {
      display: none;
    }

    .arena-stage-topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding: 0.85rem 1.1rem;
      background: rgba(14, 6, 2, 0.94);
      border: 1.5px solid var(--border-gold);
      border-radius: 14px;
    }

    .arena-switcher-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .arena-switch-btn {
      font-family: 'Cinzel', serif;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: rgba(5, 2, 1, 0.9);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 0.48rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .arena-switch-btn:hover {
      border-color: var(--gold-bright);
      color: #ffffff;
    }

    .arena-switch-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, #d97706, #ea580c);
      border-color: var(--gold-bright);
      box-shadow: 0 0 18px rgba(234, 88, 12, 0.5);
    }

    .game-arena-card {
      width: 100%;
      background: rgba(11, 5, 2, 0.95);
      border: 1.5px solid var(--border-gold);
      border-radius: 18px;
      padding: 1.25rem;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.92), 0 0 42px rgba(234, 88, 12, 0.22);
    }

    .game-card-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.95rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid rgba(245, 158, 11, 0.24);
    }

    .game-card-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.1rem, 2.8vw, 1.5rem);
      color: var(--gold-bright);
      text-shadow: 0 0 14px rgba(234, 88, 12, 0.6);
    }

    .game-card-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.55rem;
    }

    .game-card-tag {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--unicaja-glow);
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(52, 211, 153, 0.4);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
    }

    .game-iframe-shell {
      position: relative;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: 1.5px solid rgba(255, 209, 102, 0.35);
      background: #060201;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.85);
    }

    .game-iframe-shell iframe {
      display: block;
      width: 100%;
      height: 650px;
      border: 0;
    }

    .btn-exit-fullscreen {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
      display: none;
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      background: rgba(15, 6, 2, 0.92);
      border: 1.5px solid var(--gold-bright);
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.85);
    }

    .game-iframe-shell:fullscreen,
    .game-iframe-shell:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: 0 !important;
      background: #020617 !important;
    }

    .game-iframe-shell:fullscreen iframe,
    .game-iframe-shell:-webkit-full-screen iframe {
      width: 100vw !important;
      height: 100vh !important;
    }

    .game-iframe-shell:fullscreen .btn-exit-fullscreen,
    .game-iframe-shell:-webkit-full-screen .btn-exit-fullscreen {
      display: inline-flex;
    }

    @media (max-width: 768px) {
      .game-iframe-shell iframe {
        height: 460px;
      }
      .game-arena-card {
        padding: 0.85rem;
      }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      .game-iframe-shell iframe {
        height: 84vh;
      }
    }

    /* =========================================================================
       BLOQUE 3: HISTORIA ÉPICA ORIGINAL (CABECERA, GRIMORIO, CÓDICE Y ALTAR)
       ========================================================================= */
    .story-chronicle-section {
      padding-top: 1rem;
      border-top: 1px solid rgba(245, 158, 11, 0.25);
    }

    .hero-sanctuary {
      text-align: center;
      padding: 1.5rem 0.5rem 1.8rem;
      position: relative;
    }

    .crest-halo {
      position: relative;
      width: min(215px, 60vw);
      height: 122px;
      margin: 0 auto 1.4rem;
      border-radius: 16px;
      border: 2px solid var(--gold-bright);
      background: rgba(255, 255, 255, 0.96);
      box-shadow:
        0 0 38px rgba(255, 209, 102, 0.55),
        0 0 75px rgba(234, 88, 12, 0.35),
        inset 0 0 18px rgba(245, 158, 11, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .crest-halo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 8px;
      display: block;
      user-select: none;
    }

    .epic-kicker {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold-bright);
      text-shadow: 0 0 16px rgba(234, 88, 12, 0.85);
      margin-bottom: 0.6rem;
    }

    .epic-title {
      font-family: 'Cinzel Decorative', 'Cinzel', serif;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 900;
      line-height: 1.14;
      background: linear-gradient(180deg, #ffffff 5%, #ffe082 48%, #f97316 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 28px rgba(234, 88, 12, 0.75));
      margin-bottom: 0.8rem;
      word-break: break-word;
    }

    .epic-subtitle {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.95rem, 2.2vw, 1.24rem);
      color: var(--gold-pure);
      letter-spacing: 0.07em;
      max-width: 750px;
      margin: 0 auto;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9);
    }

    .story-font-toolbar {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.1rem;
    }

    .panoramic-relic-frame {
      position: relative;
      width: 100%;
      margin: 2rem auto 2.5rem;
      border-radius: 14px;
      border: 1.5px solid var(--gold-mid);
      background: linear-gradient(135deg, rgba(22, 8, 3, 0.94), rgba(8, 3, 1, 0.98));
      box-shadow:
        0 24px 65px rgba(0, 0, 0, 0.9),
        0 0 42px rgba(234, 88, 12, 0.36),
        inset 0 0 25px rgba(255, 209, 102, 0.14);
      overflow: hidden;
    }

    .ratio-16-5 {
      aspect-ratio: 16 / 5;
      min-height: 135px;
    }

    .ratio-4-1 {
      aspect-ratio: 4 / 1;
      min-height: 115px;
    }

    .panoramic-relic-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
    }

    .panoramic-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.65rem 1rem;
      background: linear-gradient(0deg, rgba(4, 1, 0, 0.92) 0%, rgba(4, 1, 0, 0.4) 65%, transparent 100%);
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold-bright);
      text-shadow: 0 0 12px rgba(234, 88, 12, 0.8);
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .story-grimoire {
      width: 100%;
      max-width: 850px;
      margin: 0 auto 3rem;
      padding: clamp(1.5rem, 4vw, 3.8rem);
      background: var(--card-bg);
      border: 1.5px solid var(--border-gold);
      border-radius: 16px;
      box-shadow:
        0 30px 85px rgba(0, 0, 0, 0.92),
        0 0 50px rgba(234, 88, 12, 0.18),
        inset 0 0 50px rgba(245, 158, 11, 0.08);
      position: relative;
    }

    .corner-filigree {
      position: absolute;
      width: 36px;
      height: 36px;
      color: var(--gold-bright);
      filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.7));
      pointer-events: none;
    }

    .corner-tl { top: 8px; left: 8px; }
    .corner-tr { top: 8px; right: 8px; transform: scaleX(-1); }
    .corner-bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
    .corner-br { bottom: 8px; right: 8px; transform: scale(-1, -1); }

    .grimoire-header-badge {
      text-align: center;
      margin-bottom: 1.8rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(245, 158, 11, 0.25);
    }

    .grimoire-rune-title {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-bright);
      text-shadow: 0 0 14px rgba(245, 158, 11, 0.65);
    }

    .grimoire-subhint {
      font-size: 0.96rem;
      font-style: italic;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .story-body {
      font-size: 1.32rem;
      color: var(--text-parchment);
      transition: font-size 0.2s ease;
    }

    .story-body p {
      margin-bottom: 1.6rem;
      text-align: left;
    }

    @media (min-width: 640px) {
      .story-body p {
        text-align: justify;
      }
    }

    .story-body p:first-of-type::first-letter {
      font-family: 'Cinzel Decorative', serif;
      font-size: 3.6rem;
      float: left;
      line-height: 0.82;
      padding-right: 0.7rem;
      padding-top: 0.16rem;
      color: var(--gold-bright);
      text-shadow: 0 0 26px rgba(234, 88, 12, 0.9);
    }

    .story-body p:last-child {
      margin-bottom: 0;
      margin-top: 1.8rem;
      padding: 1.1rem 1.25rem;
      font-style: italic;
      color: var(--gold-pure);
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.12), transparent);
      border-left: 3px solid var(--gold-bright);
      border-radius: 0 10px 10px 0;
      box-shadow: inset 0 0 20px rgba(234, 88, 12, 0.08);
    }

    .lore-link {
      font-weight: 700;
      color: var(--gold-bright);
      background: rgba(245, 158, 11, 0.15);
      border-bottom: 1.5px solid rgba(255, 209, 102, 0.65);
      padding: 0 0.3rem;
      border-radius: 4px;
      cursor: pointer;
      text-shadow: 0 0 12px rgba(245, 158, 11, 0.45);
      transition: background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    }

    .lore-link:hover {
      color: #ffffff;
      background: rgba(234, 88, 12, 0.45);
      box-shadow: 0 0 20px rgba(255, 209, 102, 0.75);
    }

    .lore-link.unicaja-theme {
      color: var(--unicaja-glow);
      background: rgba(16, 185, 129, 0.16);
      border-bottom-color: rgba(52, 211, 153, 0.75);
      text-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
    }

    .lore-link.unicaja-theme:hover {
      color: #ffffff;
      background: rgba(16, 185, 129, 0.42);
      box-shadow: 0 0 22px rgba(52, 211, 153, 0.8);
    }

    .compendium-section {
      width: 100%;
      max-width: 980px;
      margin: 2.5rem auto 0;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
      gap: 1.15rem;
      margin: 1.6rem 0 2.5rem;
    }

    .entity-card {
      position: relative;
      background: linear-gradient(165deg, rgba(24, 10, 4, 0.92), rgba(10, 4, 2, 0.95));
      border: 1px solid var(--border-gold);
      border-radius: 14px;
      padding: 1.5rem 1.15rem;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.85), inset 0 0 24px rgba(245, 158, 11, 0.06);
      transition: transform 0.28s ease, border-color 0.28s ease, box-shadow 0.28s ease;
    }

    .entity-card:hover {
      transform: translateY(-4px);
      border-color: var(--gold-bright);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.92), 0 0 34px rgba(245, 158, 11, 0.45);
    }

    .entity-card.unicaja-card {
      border-color: rgba(16, 185, 129, 0.48);
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.85), inset 0 0 24px rgba(16, 185, 129, 0.08);
    }

    .entity-card.unicaja-card:hover {
      border-color: var(--unicaja-glow);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.92), 0 0 36px rgba(16, 185, 129, 0.5);
    }

    .emblem-medallion {
      width: 60px;
      height: 60px;
      margin: 0 auto 0.85rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.25), rgba(15, 6, 2, 0.9));
      border: 1.5px solid var(--gold-bright);
      color: var(--gold-bright);
      box-shadow: 0 0 22px rgba(245, 158, 11, 0.4);
    }

    .unicaja-card .emblem-medallion {
      background: radial-gradient(circle, rgba(16, 185, 129, 0.28), rgba(4, 18, 12, 0.9));
      border-color: var(--unicaja-glow);
      color: var(--unicaja-glow);
      box-shadow: 0 0 22px rgba(16, 185, 129, 0.45);
    }

    .entity-tag {
      font-family: 'Cinzel', serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold-mid);
      margin-bottom: 0.35rem;
    }

    .unicaja-card .entity-tag {
      color: var(--unicaja-emerald);
    }

    .entity-name {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.4rem;
    }

    .entity-desc {
      font-size: 0.96rem;
      color: var(--text-muted);
      line-height: 1.48;
    }

    .alliance-altar {
      position: relative;
      text-align: center;
      padding: 2.2rem 1.2rem;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, rgba(234, 88, 12, 0.18), rgba(14, 7, 3, 0.92), rgba(16, 185, 129, 0.18));
      border: 1.5px solid var(--gold-bright);
      border-radius: 18px;
      box-shadow:
        0 26px 70px rgba(0, 0, 0, 0.92),
        0 0 48px rgba(245, 158, 11, 0.28),
        inset 0 0 35px rgba(16, 185, 129, 0.12);
    }

    .hype-kicker {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-bright);
      margin-bottom: 0.5rem;
    }

    .hype-counter-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 0.7rem 1.8rem;
      margin: 0.65rem auto 1rem;
      max-width: 100%;
      background: rgba(5, 2, 1, 0.85);
      border: 1.5px solid rgba(255, 209, 102, 0.55);
      border-radius: 999px;
      box-shadow: 0 0 30px rgba(234, 88, 12, 0.35), inset 0 0 18px rgba(16, 185, 129, 0.2);
    }

    .hype-number {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 900;
      background: linear-gradient(90deg, #ffd166, #ffffff, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 14px rgba(255, 209, 102, 0.6));
      transition: transform 0.14s ease;
    }

    .hype-number.bump {
      transform: scale(1.16);
    }

    .alliance-status {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      color: var(--gold-pure);
      margin-bottom: 1.3rem;
    }

    .btn-seal-alliance {
      position: relative;
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(0.88rem, 2.4vw, 1.12rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #ffffff;
      background: linear-gradient(90deg, #b45309, #ea580c, #059669);
      border: 2px solid var(--gold-bright);
      padding: 0.95rem 1.8rem;
      max-width: 100%;
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 0 36px rgba(245, 158, 11, 0.55), 0 0 24px rgba(16, 185, 129, 0.35);
      transition: transform 0.12s ease, box-shadow 0.25s ease;
    }

    .btn-seal-alliance:hover {
      box-shadow: 0 0 52px rgba(255, 209, 102, 0.85), 0 0 38px rgba(52, 211, 153, 0.65);
    }

    .btn-seal-alliance:active {
      transform: scale(0.95);
    }

    .hype-subnote {
      margin-top: 0.9rem;
      font-size: 0.94rem;
      font-style: italic;
      color: var(--text-muted);
    }

    /* Flotadores +1 */
    .floating-vote {
      position: fixed;
      pointer-events: none;
      font-family: 'Cinzel Decorative', serif;
      font-weight: 900;
      font-size: 1.35rem;
      z-index: 300;
      text-shadow: 0 0 14px rgba(0, 0, 0, 0.95);
      animation: floatUpVote 0.95s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes floatUpVote {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
      40% { opacity: 1; transform: translate(-50%, -38px) scale(1.18); }
      100% { opacity: 0; transform: translate(-50%, -88px) scale(0.95); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Modal del Códice */
    .codex-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 1, 0, 0.86);
      backdrop-filter: blur(10px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow-y: auto;
    }

    .codex-backdrop.active {
      display: flex;
      animation: fadeIn 0.22s ease;
    }

    .codex-modal {
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      background: linear-gradient(160deg, #1a0a04 0%, #090301 100%);
      border: 1.5px solid var(--gold-bright);
      border-radius: 16px;
      padding: 1.75rem 1.4rem;
      position: relative;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.96), 0 0 50px rgba(234, 88, 12, 0.45);
    }

    .codex-modal.unicaja-modal {
      border-color: var(--unicaja-glow);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.96), 0 0 50px rgba(16, 185, 129, 0.45);
    }

    .codex-close {
      position: absolute;
      top: 0.85rem;
      right: 0.85rem;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      z-index: 5;
    }

    .keke-square-portrait {
      position: relative;
      width: min(220px, 65vw);
      height: min(220px, 65vw);
      aspect-ratio: 1 / 1;
      margin: 0 auto 1.15rem;
      border-radius: 14px;
      border: 2px solid var(--gold-bright);
      background: radial-gradient(circle at center, rgba(234, 88, 12, 0.25), rgba(8, 3, 1, 0.96));
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.9), 0 0 36px rgba(255, 209, 102, 0.5);
      overflow: hidden;
      display: none;
    }

    .keke-square-portrait.visible {
      display: block;
    }

    .keke-square-portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
